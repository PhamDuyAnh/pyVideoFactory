schema_version: 1
project:
  id: example_cq_video
  title: "XV2DA calls CQ in despair"
  description: "Video HAM vui: gọi CQ nhưng không ai trả lời."
video: {width: 1080, height: 1920, fps: 24, background_color: "#000000", video_codec: libx264, pixel_format: yuv420p, crf: 19, preset: medium, scale_mode: cover}
audio: {sample_rate: 48000, channels: 2, target_lufs: -14.0, true_peak_db: -1.5, default_voice_gain_db: 0.0, default_effect_gain_db: -12.0, default_ambience_gain_db: -24.0}
style: {font_file: null, font_name: "Arial", font_size: 66, primary_color: "#FFFFFF", outline_color: "#000000", outline_width: 4, shadow: 1, alignment: bottom_center, margin_left: 80, margin_right: 80, margin_bottom: 250}
scenes:
  - {id: first_cq, file: input/video/scene_01.mp4, start: 0.4, duration: 5.1, transition_after: {type: cut, duration: 0.0}}
  - {id: listening, file: input/video/scene_02.mp4, start: 0.5, duration: 2.0, transition_after: {type: crossfade, duration: 0.15}}
  - {id: time_passing, file: input/video/scene_03.mp4, start: 0.0, duration: 2.8, transition_after: {type: cut, duration: 0.0}}
  - {id: second_cq, file: input/video/scene_04.mp4, start: 0.2, duration: 3.3, transition_after: {type: crossfade, duration: 0.15}}
  - {id: punchline, file: input/video/scene_05.mp4, start: 0.0, duration: 4.0, transition_after: {type: cut, duration: 0.0}}
captions:
  - {id: opening, text: "Tối nay nhất định có DX!", start: 0.2, end: 2.2, position: bottom_center}
  - {id: later, text: "Hơn một giờ sau…", start: 7.0, end: 9.2, position: bottom_center}
  - {id: question, text: "Có ai nghe XV2DA không?", start: 10.1, end: 13.0, position: bottom_center}
audio_tracks:
  - {id: first_voice, type: file, role: voice, file: input/audio/cq_first.wav, start: 0.6, trim_start: 0.0, gain_db: 0.0, fade_in: 0.03, fade_out: 0.08}
  - {id: ptt_start, type: generated_tone, role: effect, start: 0.42, duration: 0.08, frequency_hz: 1000, gain_db: -16.0}
  - {id: listening_static, type: generated_noise, role: ambience, noise: pink, start: 5.7, duration: 1.6, highpass_hz: 350, lowpass_hz: 3200, gain_db: -24.0}
  - {id: ticks, type: generated_ticks, role: effect, start: 7.8, duration: 2.2, interval: 0.16, frequency_hz: 1800, gain_db: -20.0}
  - {id: tired_voice, type: file, role: voice, file: input/audio/cq_tired.wav, start: 10.1, trim_start: 0.0, gain_db: 0.0, radio_voice: true}
outputs:
  master: {file: output/final_short_1080p.mp4, width: 1080, height: 1920}
  preview: {enabled: true, file: output/preview_720p.mp4, width: 405, height: 720, crf: 25}
  report: {file: output/render_report.json}

